# What a change has to pass: the checks from AGENTS.md, the style guide in three browsers, and the
# build the examples load. Each browser has its own job, beside the one for the rest, so they run
# side by side and a failure names its engine.
name: Check

# Once per pull request: main only takes merged pull requests, and a tag runs release.yml, which
# calls this workflow before it publishes. "Run workflow" checks any branch by hand.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build:elements

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox]
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          LINTJE_BROWSERS: ${{ matrix.browser }}
          DEBUG: ${{ matrix.n == 1 && 'pw:api' || '' }}
