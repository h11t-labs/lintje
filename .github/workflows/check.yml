# What a change has to pass: the checks from AGENTS.md, the style guide in three browsers, and the
# build the examples load. Each browser has its own job, beside the one for the rest, so they run
# side by side and a failure names its engine.
name: Check

# Once per pull request: main only takes merged pull requests, and a tag runs release.yml, which
# calls this workflow before it publishes. "Run workflow" checks any branch by hand.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build:elements

  # Playwright's image carries the browsers and their system packages, so the job never waits on the
  # Ubuntu mirror, which sometimes serves the WebKit packages at a crawl. The tag moves together with
  # `playwright` in package-lock.json.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:browser
        env:
          LINTJE_BROWSERS: ${{ matrix.browser }}
