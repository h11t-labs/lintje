# What a change has to pass: the checks from AGENTS.md, the style guide in three browsers, and the
# build the examples load.
name: Check

# Once per pull request: main only takes merged pull requests, and a tag runs release.yml, which
# repeats these checks before it publishes. "Run workflow" checks any branch by hand.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:browser
        env:
          LINTJE_BROWSERS: chromium,webkit,firefox
      - run: npm run build:elements
