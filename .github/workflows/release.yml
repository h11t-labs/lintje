# Publishes a release when a version tag (v0.2.0) is pushed: the package to npm, and a GitHub
# release with the tarball and the changelog section of that version as its notes. The tag must
# equal the version in package.json and have its section in CHANGELOG.md, and the release passes
# the same checks as check.yml first. Needs the repository secret NPM_TOKEN; --provenance links
# the package to this run.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: The tag is the version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: The changelog has this version
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:browser
        env:
          LINTJE_BROWSERS: chromium,webkit,firefox
      - run: npm run build:elements
      - run: npm pack
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: The GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md lintje-*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
